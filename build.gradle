plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'dev.ioexception'
version = '1.0.1'
description = 'dicom-proxy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.dcm4che.org/' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.postgresql:postgresql:42.7.11'
    implementation 'com.mysql:mysql-connector-j:9.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.0.5'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    implementation 'co.elastic.clients:elasticsearch-java:9.3.4'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'co.elastic.logging:logback-ecs-encoder:1.7.0'
    implementation 'co.elastic.apm:apm-agent-api:1.55.6'

    // dcm4che
    implementation 'org.dcm4che:dcm4che-core:5.29.1'
    implementation 'org.dcm4che:dcm4che-net:5.29.1'
    implementation 'org.dcm4che:dcm4che-mime:5.29.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    if (project.hasProperty('testJvmArgs')) {
        jvmArgs project.property('testJvmArgs').toString().split(' ')
    }
}
