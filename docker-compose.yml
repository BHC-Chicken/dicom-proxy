services:
  dicom-proxy:
    image: "${DICOM_IMAGE}"
    build: "${DICOM_BUILD_CONTEXT}"
    container_name: "${DICOM_CONTAINER_NAME}"
    ports:
      - "${DICOM_HTTP_PORT_MAPPING}" # Spring Boot Web API 포트
      - "${DICOM_SCP_PORT_MAPPING}" # DICOM SCP 포트
    volumes:
      # 로컬 호스트 경로의 인증서와 DICOM 저장 디렉토리를 컨테이너 내부로 바인딩 마운트
      - ${CERTS_DIR}:${CERTS_LEGACY_CONTAINER_DIR}:ro
      - ${CERTS_DIR}:${CERTS_CONTAINER_DIR}:ro
      - ${ES_CA_PATH}:${ES_CA_CONTAINER_PATH}:ro
      - ${DICOM_SCP_BASE_DIR}:${DICOM_SCP_CONTAINER_DIR}
    environment:
      # JVM 옵션 및 레거시 TLS 설정, Elastic APM 설정
      - JAVA_OPTS=${JAVA_OPTS}

      # Spring Boot 환경변수
      - BASE_URL=${BASE_URL}
      - CERTIFICATE_PATH=${CERTIFICATE_PATH}
      - PRIVATE_KEY_PATH=${PRIVATE_KEY_PATH}
      - CERTIFICATE_PASSWORD=${CERTIFICATE_PASSWORD}
      - CLIENT_CA_PATH=${CLIENT_CA_PATH}
      - CAPATH=${CAPATH}

      # 동시성 가버너 (스레드/Semaphore 허가 한도 제어)
      - MAX_DICOM_REQUEST=${MAX_DICOM_REQUEST}
      - DICOM_FORWARD_SPOOL_DIR=${DICOM_FORWARD_SPOOL_DIR}
      - DICOM_FORWARD_MAX_SPOOL_SIZE=${DICOM_FORWARD_MAX_SPOOL_SIZE}
      - DICOM_FORWARD_MIN_FREE_DISK_SPACE=${DICOM_FORWARD_MIN_FREE_DISK_SPACE}
      - DICOM_FORWARD_MAX_METADATA_SCAN_SIZE=${DICOM_FORWARD_MAX_METADATA_SCAN_SIZE}
      - DICOM_FORWARD_MAX_STOW_RESPONSE_SIZE=${DICOM_FORWARD_MAX_STOW_RESPONSE_SIZE}
      - DICOM_FORWARD_MAX_CONCURRENT_SPOOLS=${DICOM_FORWARD_MAX_CONCURRENT_SPOOLS}
      - DICOM_FORWARD_STALE_SPOOL_RETENTION=${DICOM_FORWARD_STALE_SPOOL_RETENTION}

      # DICOM SCP 관련 설정
      - DICOM_SCP_ENABLED=${DICOM_SCP_ENABLED}
      - DICOM_SCP_AET=${DICOM_SCP_AET}
      - DICOM_SCP_ALLOWED_AETS=${DICOM_SCP_ALLOWED_AETS}
      - DICOM_SCP_BASE_DIR=${DICOM_SCP_CONTAINER_DIR}
      - DICOM_SCP_MAX_THREADS=${DICOM_SCP_MAX_THREADS}
      - DICOM_SCP_PORT=${DICOM_SCP_PORT}
      - DICOM_SCP_TLS_ENABLED=${DICOM_SCP_TLS_ENABLED}
      - DICOM_SCP_MTLS_ENABLED=${DICOM_SCP_MTLS_ENABLED}

      # Discord 알림 설정
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}


      # PostgreSQL 데이터베이스 설정 (컨테이너 내에서는 host.docker.internal을 통해 호스트 DB로 통신)
      - POSTGRESQL_DATASOURCE_URL=${DOCKER_POSTGRESQL_DATASOURCE_URL}
      - POSTGRESQL_DATASOURCE_USERNAME=${POSTGRESQL_DATASOURCE_USERNAME}
      - POSTGRESQL_DATASOURCE_PASSWORD=${POSTGRESQL_DATASOURCE_PASSWORD}

      # Elasticsearch 설정
      - SPRING_ELASTICSEARCH_URIS=${SPRING_ELASTICSEARCH_URIS}
      - SPRING_ELASTICSEARCH_USERNAME=${SPRING_ELASTICSEARCH_USERNAME}
      - SPRING_ELASTICSEARCH_PASSWORD=${SPRING_ELASTICSEARCH_PASSWORD}

      # Google AI Studio / Confluence RAG 서비스 설정
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GOOGLE_AI_EMBEDDING_MODEL=${GOOGLE_AI_EMBEDDING_MODEL}
      - GOOGLE_AI_OUTPUT_DIMENSIONALITY=${GOOGLE_AI_OUTPUT_DIMENSIONALITY}
      - GOOGLE_AI_CHAT_MODEL=${GOOGLE_AI_CHAT_MODEL}

    # 컨테이너 내에서 host.docker.internal 도메인을 호스트 머신 IP로 연결하기 위한 설정 (macOS 호스트 연결용)
    extra_hosts:
      - "${DOCKER_HOST_MAPPING}"
      - "${PACS_HOST_MAPPING}"
