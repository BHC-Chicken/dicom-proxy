spring:
  application:
    name: dicom-proxy
  threads:
    virtual:
      enabled: true
  ssl:
    bundle:
      pem:
        dicom-bundle:
          keystore:
            certificate: "${CERTIFICATE_PATH}"
            private-key: "${CERTIFICATE_PATH}"
            private-key-password: "${CERTIFICATE_PASSWORD}"
          truststore:
            certificate: "${CERTIFICATE_PATH}"
          key:
            password: "${CERTIFICATE_PASSWORD}"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

base-url: "${BASE_URL}"

dicom:
  scp:
    aet: "${DICOM_SCP_AET}"
    port: "${DICOM_SCP_PORT}"
    allowed-aets: "${DICOM_SCP_ALLOWED_AETS}"
    base-dir: "${DICOM_SCP_BASE_DIR}"
    max-threads: "${DICOM_SCP_MAX_THREADS}"