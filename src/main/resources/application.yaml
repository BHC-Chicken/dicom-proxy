spring:
  application:
    name: dicom-proxy
  threads:
    virtual:
      enabled: true
  ssl:
    bundle:
      pem:
        dicom-bundle:
          keystore:
            certificate: "${CERTIFICATE_PATH:classpath:dummy.crt}"
            private-key: "${PRIVATE_KEY_PATH:${CERTIFICATE_PATH:classpath:dummy.key}}"
            private-key-password: "${CERTIFICATE_PASSWORD:dummy}"
          truststore:
            certificate: "${CLIENT_CA_PATH:${TRUSTSTORE_PATH:${CERTIFICATE_PATH:classpath:dummy.crt}}}"
          key:
            password: "${CERTIFICATE_PASSWORD:dummy}"
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 5GB
  datasource:
    url: "${POSTGRESQL_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dicom}"
    username: "${POSTGRESQL_DATASOURCE_USERNAME:postgres}"
    password: "${POSTGRESQL_DATASOURCE_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  elasticsearch:
    uris: "${SPRING_ELASTICSEARCH_URIS:https://localhost:9200}"
    username: "${SPRING_ELASTICSEARCH_USERNAME:elastic}"
    password: "${SPRING_ELASTICSEARCH_PASSWORD:password}"
    ca-path: "${CAPATH:/usr/share/app/certs/ca.crt}"

base-url: "${BASE_URL:http://localhost:8080}"

discord:
  webhook:
    url : "${DISCORD_WEBHOOK_URL:http://localhost}"

dicom:
  max-concurrency: "${MAX_DICOM_REQUEST:10}"
  forward:
    spool-dir: "${DICOM_FORWARD_SPOOL_DIR:${java.io.tmpdir}/dicom-proxy-forward}"
    max-spool-size: "${DICOM_FORWARD_MAX_SPOOL_SIZE:5GB}"
    min-free-disk-space: "${DICOM_FORWARD_MIN_FREE_DISK_SPACE:5GB}"
    max-metadata-scan-size: "${DICOM_FORWARD_MAX_METADATA_SCAN_SIZE:8MB}"
    max-stow-response-size: "${DICOM_FORWARD_MAX_STOW_RESPONSE_SIZE:1MB}"
    max-concurrent-spools: "${DICOM_FORWARD_MAX_CONCURRENT_SPOOLS:10}"
    stale-spool-retention: "${DICOM_FORWARD_STALE_SPOOL_RETENTION:24h}"
    job:
      retention: "${DICOM_FORWARD_JOB_RETENTION:24h}"
      max-entries: "${DICOM_FORWARD_JOB_MAX_ENTRIES:10000}"
    admission:
      enabled: "${DICOM_FORWARD_ADMISSION_ENABLED:true}"
      max-concurrent-uploads: "${DICOM_FORWARD_MAX_CONCURRENT_UPLOADS:10}"
  scp:
    enabled: "${DICOM_SCP_ENABLED:true}"
    aet: "${DICOM_SCP_AET:DICOM_PROXY}"
    port: "${DICOM_SCP_PORT:11112}"
    allowed-aets: "${DICOM_SCP_ALLOWED_AETS:ANY}"
    base-dir: "${DICOM_SCP_BASE_DIR:./dicom_store}"
    max-threads: "${DICOM_SCP_MAX_THREADS:10}"
    tls:
      enabled: "${DICOM_SCP_TLS_ENABLED:false}"
      bundle: "${DICOM_SCP_TLS_BUNDLE:dicom-bundle}"
      need-client-auth: "${DICOM_SCP_TLS_NEED_CLIENT_AUTH:${DICOM_SCP_MTLS_ENABLED:false}}"

server:
  port: 80

logging:
  level:
    dev.ioexception.dicom: DEBUG
