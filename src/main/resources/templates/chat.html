<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confluence RAG Knowledge Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Highlight.js CSS for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/chat.css}" href="/css/chat.css">

    <!-- External Libraries (Marked.js & Highlight.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<div class="app-layout">
    <!-- 1. 좌측 세션 사이드바 조각 -->
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

    <!-- 2. 대화 메인 창 조각 -->
    <th:block th:replace="~{fragments/chat-window :: chatWindow}"></th:block>
</div>

<!-- 3. 필터 설정 모달 조각 -->
<th:block th:replace="~{fragments/filter-modal :: filterModal}"></th:block>

<!-- Custom JS -->
<script th:src="@{/js/chat.js}" src="/js/chat.js"></script>
</body>
</html>
